<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Async JavaScript - User Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>User Finder</h1>

            <p>
                Search users using Async JavaScript
            </p>
        </header>

        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search users by name..."
            >

            <button id="searchButton">
                Search
            </button>

            <button id="loadButton">
                Load Users
            </button>

        </section>

        <section class="status-section">

            <p id="statusMessage" aria-live="polite">
                Click "Load Users" to get started.
            </p>

        </section>

        <section
            id="usersContainer"
            class="users-container"
        ></section>

    </main>

    <script src="main.js"></script>

</body>

</html>
